services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-starter}
      MYSQL_USER: ${DB_USERNAME:-starter}
      MYSQL_PASSWORD: ${DB_PASSWORD:-local-development-only}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-local-development-root-only}
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
  backend:
    build:
      context: .
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-starter}
      DB_USERNAME: ${DB_USERNAME:-starter}
      DB_PASSWORD: ${DB_PASSWORD:-local-development-only}
      SERVER_PORT: 8080
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  mysql_data:
