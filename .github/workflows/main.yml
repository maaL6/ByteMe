
name: ByteMe CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run unit tests
        run: |
          chmod +x ./mvnw
          ./mvnw -B test -Dtest="!*IntegrationTest,!DatabaseDesignTests"
          
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
  

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check Docker
        run: docker info

      - name: Run integration tests
        run: |
          chmod +x ./mvnw
          ./mvnw -B test \
            -Dtest="*IntegrationTest,DatabaseDesignTests"
  
  deploy:
    name: Deploy and Smoke Test
    needs: [unit-test, integration-test]
    runs-on: ubuntu-latest

    steps:
      # 1. Download source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. Generate RSA keys for JWT
      - name: Generate JWT keys
        run: |
          python -m venv .venv
          .venv/bin/pip install cryptography==50.0.2
          .venv/bin/python scripts/generate-keys.py
          .venv/bin/python scripts/prepare-docker-keys.py

          # Backend runs as UID 10001
          sudo chown -R 10001:10001 .local/docker-keys

      # 4. Check Docker environment
      - name: Check Docker
        run: |
          docker --version
          docker compose version

      # 5. Build Docker image
      - name: Build Docker image
        run: docker compose build backend

      # 6. Deploy application
      - name: Start application
        run: docker compose up -d --no-build

      # 7. Wait for backend and verify API
      - name: Smoke Test
        run: |
          echo "Waiting for ByteMe backend..."

          for i in $(seq 1 60); do
            if curl --silent --fail \
              http://127.0.0.1:8080/api/foods \
              --output /dev/null; then
              echo "ByteMe API is healthy!"
              exit 0
            fi

            echo "Attempt $i: Backend not ready"
            sleep 5
          done

          echo "Backend failed to start!"
          exit 1

      # 8. Show logs
      - name: Show container logs
        if: always()
        run: docker compose logs --no-color --tail=100

      # 9. Clean up containers
      - name: Clean up
        if: always()
        run: docker compose down -v --remove-orphans
