spring:
  application:
    name: byteme
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-init-sql: SET time_zone = '+00:00'
  jackson:
    deserialization:
      # Enum phải gửi bằng tên (DINE_IN, CASH...); 0 hoặc "0" trả 400 thay vì bị hiểu là ordinal.
      fail-on-numbers-for-enums: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
auth:
  private-key-file: ${AUTH_JWT_PRIVATE_KEY_FILE:.local/private.pem}
  public-key-file: ${AUTH_JWT_PUBLIC_KEY_FILE:.local/public.pem}
  ttl-seconds: ${AUTH_ACCESS_TOKEN_TTL_SECONDS:5400}
  login:
    email-limit: ${AUTH_LOGIN_EMAIL_LIMIT:10}
    ip-limit: ${AUTH_LOGIN_IP_LIMIT:100}
    window-seconds: ${AUTH_LOGIN_WINDOW_SECONDS:900}
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    url: /openapi.yaml
    disable-swagger-default-url: true
