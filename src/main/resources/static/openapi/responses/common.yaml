  headers:
    Cache-Control:
      description: Không cache dữ liệu Auth.
      schema:
        type: string
        enum:
        - no-store
    Retry-After:
      description: Số giây nguyên dương cần chờ, tính theo rate limit cấu hình.
      schema:
        type: integer
        minimum: 1
      example: 60
  content:
    application/json:
      schema:
        $ref: ../schemas/common.yaml#/ApiError
      examples:
        LOGIN_RATE_LIMITED:
          value:
            status: 429
            code: LOGIN_RATE_LIMITED
            message: Vượt giới hạn đăng nhập.
            path: /api/auth/token
            fieldErrors: []
