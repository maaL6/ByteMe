registerCustomer201:
  description: Account được tạo; không cung cấp GET Account hoặc Location. Không có password/hash.
  headers:
    Cache-Control:
      description: Không cache dữ liệu Auth.
      schema:
        type: string
        enum:
        - no-store
  content:
    application/json:
      schema:
        $ref: ../schemas/user.yaml#/RegisteredAccount
      examples:
        created:
          value:
            id: account-customer-001
            fullName: Khách hàng mẫu
            email: customer@example.com
            phone: '+12025550101'
            role: CUSTOMER
            status: ACTIVE
registerCustomer400:
  description: Dữ liệu đầu vào không hợp lệ. / Mật khẩu xác nhận không khớp.
  headers:
    Cache-Control:
      description: Không cache dữ liệu Auth.
      schema:
        type: string
        enum:
        - no-store
  content:
    application/json:
      schema:
        $ref: ../schemas/common.yaml#/ApiError
      examples:
        VALIDATION_ERROR:
          value:
            status: 400
            code: VALIDATION_ERROR
            message: Dữ liệu đầu vào không hợp lệ.
            path: /api/auth/register
            fieldErrors: []
        PASSWORD_MISMATCH:
          value:
            status: 400
            code: PASSWORD_MISMATCH
            message: Mật khẩu xác nhận không khớp.
            path: /api/auth/register
            fieldErrors:
            - field: confirmPassword
              message: Phải trùng password.
registerCustomer409:
  description: Thông tin tài khoản đã được sử dụng.
  headers:
    Cache-Control:
      description: Không cache dữ liệu Auth.
      schema:
        type: string
        enum:
        - no-store
  content:
    application/json:
      schema:
        $ref: ../schemas/common.yaml#/ApiError
      examples:
        ACCOUNT_CONFLICT:
          value:
            status: 409
            code: ACCOUNT_CONFLICT
            message: Thông tin tài khoản đã được sử dụng.
            path: /api/auth/register
            fieldErrors: []
registerCustomer415:
  description: Chỉ hỗ trợ application/json.
  headers:
    Cache-Control:
      description: Không cache dữ liệu Auth.
      schema:
        type: string
        enum:
        - no-store
  content:
    application/json:
      schema:
        $ref: ../schemas/common.yaml#/ApiError
      examples:
        UNSUPPORTED_MEDIA_TYPE:
          value:
            status: 415
            code: UNSUPPORTED_MEDIA_TYPE
            message: Chỉ hỗ trợ application/json.
            path: /api/auth/register
            fieldErrors: []
registerCustomer500:
  description: Đã xảy ra lỗi hệ thống.
  headers:
    Cache-Control:
      description: Không cache dữ liệu Auth.
      schema:
        type: string
        enum:
        - no-store
  content:
    application/json:
      schema:
        $ref: ../schemas/common.yaml#/ApiError
