          value:
            status: 500
            code: INTERNAL_ERROR
            message: Đã xảy ra lỗi hệ thống.
            path: /api/auth/register
            fieldErrors: []
issueAccessToken200:
  description: Credentials đúng và account ACTIVE; expiresIn là TTL thực tế theo giây.
  headers:
    Cache-Control:
      description: Không cache dữ liệu Auth.
      schema:
        type: string
        enum:
        - no-store
  content:
    application/json:
      schema:
        $ref: ../schemas/auth.yaml#/TokenResponse
      examples:
        customer:
          value:
            accessToken: jwt-example-not-valid
            tokenType: Bearer
            expiresIn: 5400
            user:
              id: account-customer-001
              fullName: Khách hàng mẫu
              email: customer@example.com
              phone: '+12025550101'
              role: CUSTOMER
              status: ACTIVE
        staff:
          value:
            accessToken: jwt-example-not-valid
            tokenType: Bearer
            expiresIn: 5400
            user:
              id: account-staff-001
              fullName: Khách hàng mẫu
              email: staff@example.com
              phone: '+12025550101'
              role: EMPLOYEE
              status: ACTIVE
        admin:
          value:
            accessToken: jwt-example-not-valid
            tokenType: Bearer
            expiresIn: 5400
            user:
              id: account-admin-001
              fullName: Khách hàng mẫu
              email: admin@example.com
              phone: '+12025550101'
              role: ADMIN
              status: ACTIVE
