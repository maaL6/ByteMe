openapi: 3.0.3
info:
  title: ByteMe API
  version: 1.0.0
  description: |-
    Đặc tả Auth, Food, Cart và Order theo controller, DTO, service, repository,
    SecurityConfiguration, AuthJsonAdvice và GlobalErrors trong mã nguồn.

    Quyền theo đúng role, không có kế thừa: ADMIN chỉ quản lý món, không được dùng
    Cart/Order; EMPLOYEE không được dùng Cart hoặc tạo/hủy đơn qua route CUSTOMER.
    Cart/Order cần JWT có sub parse được thành số nguyên int64 > 0; sai sub trả
    403 FORBIDDEN. Bước này chỉ kiểm tra dạng ID, không truy vấn tài khoản.
    GET Food công khai nhưng nếu gửi Bearer JWT không hợp lệ vẫn nhận 401;
    hai route Auth không xác thực Bearer JWT.

    Auth từ chối thuộc tính JSON lạ, JSON có token dư sau object và giá trị
    số/boolean thay cho chuỗi. Food/Cart/Order bỏ qua thuộc tính lạ theo cấu hình
    Jackson mặc định; chỉ các trường DTO được dùng, nên không nhận giá/món/userId
    do client tự chỉ định khi checkout. Enum phải là tên chính xác, phân biệt
    hoa thường; số hoặc chuỗi số cho enum trả 400. Trường số nguyên không nhận
    số thực. Các giới hạn chuỗi của Bean Validation áp dụng trước khi service trim.

    Lỗi được handler/filter của API xử lý có dạng ApiError và Cache-Control:
    no-store. fieldErrors có thể rỗng, kể cả lỗi nghiệp vụ VALIDATION_ERROR.
    HTTP 400 = VALIDATION_ERROR (hoặc PASSWORD_MISMATCH ở đăng ký, EMPTY_CART ở
    checkout); 401 = UNAUTHENTICATED hoặc INVALID_CREDENTIALS; 403 = FORBIDDEN
    hoặc ACCOUNT_NOT_ACTIVE ở đăng nhập. HTTP 409 dùng mã nghiệp vụ theo thao tác,
    CONFLICT cho vi phạm ràng buộc DB (UNIQUE/FK/CHECK), CONCURRENT_UPDATE cho
    deadlock/hết thời gian chờ khóa. Lỗi không được xử lý cụ thể trả 500 INTERNAL_ERROR.
    Route không tồn tại/method không hỗ trợ, khi vượt qua security, được ánh xạ
    404 NOT_FOUND / 405 METHOD_NOT_ALLOWED. Các mã này không phải lỗi nghiệp vụ
    của một operation hợp lệ trong danh sách bên dưới.
servers:
  - url: /
    description: Cùng origin với Swagger UI
tags:
  - name: Auth
    description: Đăng ký và đăng nhập.
  - name: Food
    description: Đọc và quản lý thực đơn.
  - name: Cart
    description: Giỏ hàng của CUSTOMER hiện tại.
  - name: Order
    description: Tạo, đọc và chuyển trạng thái đơn hàng.
paths:
  /api/auth/register:
    post:
      tags: [Auth]
      operationId: registerCustomer
      summary: Đăng ký tài khoản CUSTOMER
      description: >-
        Tạo CUSTOMER/ACTIVE, không cấp JWT. fullName/email/phone được trim;
        email chuyển về chữ thường. Password giữ nguyên và confirmPassword phải
        khớp chính xác, nếu không trả 400 PASSWORD_MISMATCH. Email hoặc phone đã
        dùng trả 409 ACCOUNT_CONFLICT; đầu vào sai trả 400 VALIDATION_ERROR.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              fullName: Nguyễn Văn An
              email: customer@example.com
              phone: '0900000001'
              password: DemoOnly123!
              confirmPassword: DemoOnly123!
      responses:
        '201':
          $ref: '#/components/responses/AccountCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/auth/token:
    post:
      tags: [Auth]
      operationId: issueAccessToken
      summary: Đăng nhập và cấp Bearer JWT
      description: >-
        Email được trim và chuyển về chữ thường; password giữ nguyên. Sai email
        hoặc password trả 401 INVALID_CREDENTIALS; chỉ sau khi password đúng mới
        kiểm tra trạng thái tài khoản, INACTIVE/LOCKED trả 403 ACCOUNT_NOT_ACTIVE.
        Quota in-memory mặc định 100 request/IP và 10 request/email đã chuẩn hóa
        trong cửa sổ 900 giây, cấu hình được qua auth.login. Quota IP tính trước
        khi đọc body; quota email tính sau khi email/password hợp lệ về định dạng;
        cả đăng nhập thành công và sai credentials đều tiêu quota. Vượt quota trả
        429 LOGIN_RATE_LIMITED và Retry-After. JWT RS256 có TTL mặc định 5400 giây
        (auth.ttl-seconds); chưa có refresh/logout/revocation.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: customer@example.com
              password: DemoOnly123!
      responses:
        '200':
          $ref: '#/components/responses/TokenIssued'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/foods:
    get:
      tags: [Food]
      operationId: listActiveFoods
      summary: Xem danh sách món đang bán
      description: >-
        Chỉ trả ACTIVE, kể cả món có tồn kho 0; sắp xếp id tăng dần, không phân
        trang. categoryId không tồn tại trả 404 CATEGORY_NOT_FOUND; danh mục hợp
        lệ nhưng chưa có món ACTIVE trả 200 với mảng rỗng.
      security: []
      parameters:
        - $ref: '#/components/parameters/CategoryIdQuery'
      responses:
        '200':
          $ref: '#/components/responses/FoodList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Food]
      operationId: createFood
      summary: Thêm món ăn
      description: >-
        Chỉ ADMIN. categoryId phải tồn tại (404 CATEGORY_NOT_FOUND). Tên được trim
        và kiểm tra trùng toàn thực đơn, kể cả món INACTIVE (409 FOOD_NAME_CONFLICT;
        race vi phạm UNIQUE trả CONFLICT). stockQuantity null/bỏ qua mặc định 0;
        status null/bỏ qua mặc định ACTIVE. Có thể tạo trực tiếp món INACTIVE.
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/FoodBody'
      responses:
        '201':
          $ref: '#/components/responses/Food'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/foods/search:
    get:
      tags: [Food]
      operationId: searchActiveFoods
      summary: Tìm món đang bán theo từ khóa
      description: >-
        Tìm chuỗi con trong tên hoặc mô tả, không phân biệt hoa thường; q được trim.
        Các ký tự %, _ và ! được escape, không là wildcard do client chỉ định.
        Chỉ trả ACTIVE, kể cả tồn kho 0; id tăng dần, không phân trang. Kiểm tra q
        trước categoryId; q sai trả 400 VALIDATION_ERROR, danh mục không tồn tại
        trả 404 CATEGORY_NOT_FOUND, không có kết quả trả 200 với mảng rỗng.
      security: []
      parameters:
        - name: q
          in: query
          required: true
          description: Từ khóa sau String.trim phải có từ 1 đến 100 đơn vị UTF-16; khoảng trắng hai đầu không tính vào giới hạn.
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/CategoryIdQuery'
      responses:
        '200':
          $ref: '#/components/responses/FoodList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/foods/{id}:
    parameters:
      - $ref: '#/components/parameters/FoodIdPath'
    get:
      tags: [Food]
      operationId: getActiveFood
      summary: Xem chi tiết món đang bán
      description: Món không tồn tại hoặc INACTIVE trả 404 FOOD_NOT_FOUND, áp dụng cả với ADMIN.
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Food'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Food]
      operationId: updateFood
      summary: Cập nhật món ăn
      description: >-
        Chỉ ADMIN; sửa được cả món INACTIVE. categoryId, name, price luôn bắt buộc.
        name được trim; tên trùng món khác, kể cả INACTIVE, trả 409 FOOD_NAME_CONFLICT.
        description/imageUrl bỏ qua hoặc null sẽ xóa giá trị cũ; stockQuantity/status
        bỏ qua hoặc null giữ nguyên. Có thể đặt status ACTIVE để bán lại. Món không
        tồn tại trả 404 FOOD_NOT_FOUND; categoryId không tồn tại trả 404 CATEGORY_NOT_FOUND.
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/FoodBody'
      responses:
        '200':
          $ref: '#/components/responses/Food'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Food]
      operationId: deactivateFood
      summary: Ngừng bán món ăn
      description: >-
        Chỉ ADMIN. Soft delete bằng trạng thái INACTIVE, giữ bản ghi và các tham chiếu.
        Gọi lại với món đã INACTIVE vẫn trả 204, không có body. ID không tồn tại
        (kể cả ≤ 0) trả 404 FOOD_NOT_FOUND. Chỉ trả 400 VALIDATION_ERROR khi id
        không chuyển được sang int64 (không phải số nguyên hoặc vượt miền int64).
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Món đã chuyển sang INACTIVE; response không có body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/cart:
    get:
      tags: [Cart]
      operationId: getCurrentCart
      summary: Xem giỏ hàng hiện tại
      description: >-
        Khách chưa có giỏ nhận 200 với `id: null` và `items: []`; thao tác đọc
        không tạo giỏ. Chỉ CUSTOMER; giỏ được tạo ở lần thêm món đầu tiên.
        Các dòng theo id tăng dần. food là thông tin hiện tại, không phải snapshot;
        món đã INACTIVE vẫn xuất hiện trong giỏ. Giỏ không giữ chỗ hoặc trừ tồn kho.
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Cart'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/cart/items:
    post:
      tags: [Cart]
      operationId: addCartItem
      summary: Thêm món vào giỏ
      description: >-
        Chỉ CUSTOMER. Tạo giỏ nếu chưa có; món đã có thì cộng quantity vào dòng cũ.
        Món không tồn tại trả 404 FOOD_NOT_FOUND; INACTIVE trả 409 FOOD_UNAVAILABLE.
        Không kiểm tra/trừ tồn kho. Tổng quantity vượt 2147483647 trả 400 VALIDATION_ERROR.
        Thành công trả 200 với toàn bộ giỏ sau thao tác.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddToCartRequest'
            example:
              foodId: 1
              quantity: 2
      responses:
        '200':
          $ref: '#/components/responses/Cart'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/cart/items/{cartItemId}:
    parameters:
      - $ref: '#/components/parameters/CartItemIdPath'
    put:
      tags: [Cart]
      operationId: updateCartItem
      summary: Đặt lại số lượng của một dòng giỏ hàng
      description: >-
        Chỉ CUSTOMER; quantity thay thế số lượng hiện tại, không cộng dồn. Không
        kiểm tra trạng thái món hoặc tồn kho. Chưa có giỏ, dòng không tồn tại hoặc
        thuộc giỏ người khác đều trả 404 CART_ITEM_NOT_FOUND. quantity = 0 trả 400
        VALIDATION_ERROR; muốn xóa phải dùng DELETE. Trả 200 với toàn bộ giỏ.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCartItemRequest'
            example:
              quantity: 3
      responses:
        '200':
          $ref: '#/components/responses/Cart'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Cart]
      operationId: removeCartItem
      summary: Xóa một dòng khỏi giỏ hàng
      description: >-
        Chỉ CUSTOMER. Chưa có giỏ, dòng không tồn tại hoặc thuộc giỏ người khác
        đều trả 404 CART_ITEM_NOT_FOUND, kể cả gọi lại sau khi đã xóa. Trả 200 với
        toàn bộ giỏ còn lại; xóa dòng cuối giữ nguyên bản ghi giỏ với items rỗng.
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Cart'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/orders:
    post:
      tags: [Order]
      operationId: createOrder
      summary: Tạo đơn từ giỏ hàng hiện tại
      description: >-
        Chỉ CUSTOMER. Kiểm tra quy tắc orderType trước khi đọc giỏ; sai trả 400
        VALIDATION_ERROR. Sau đó chưa có giỏ hoặc giỏ rỗng trả 400 EMPTY_CART.
        Trong một transaction: đọc giỏ theo thứ tự dòng, kiểm tra ACTIVE và tồn
        kho từng món, trừ kho, lưu đơn PENDING với snapshot tên/giá hiện tại từ
        server, rồi dọn giỏ (giữ ID giỏ). Bất kỳ lỗi nào đều rollback toàn bộ.
        Món không tồn tại trả 404 FOOD_NOT_FOUND, INACTIVE trả 409 FOOD_UNAVAILABLE,
        thiếu kho trả 409 INSUFFICIENT_STOCK. Không có phí giao hàng/thuế trong tổng.
        paymentMethod chỉ ghi nhận phương thức, không thực hiện thanh toán.
        Chưa có idempotency key: gửi lại sau khi giỏ đã dọn trả EMPTY_CART.
        Phase 1 không khóa hàng; checkout đồng thời có thể bán vượt kho hoặc tạo
        đơn trùng từ cùng giỏ. Deadlock/hết thời gian chờ khóa trả 409 CONCURRENT_UPDATE;
        server không tự retry.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            examples:
              dineIn:
                value:
                  orderType: DINE_IN
                  tableNumber: B05
                  paymentMethod: CASH
                  note: Ít cay
              delivery:
                value:
                  orderType: DELIVERY
                  recipientName: Nguyễn Văn An
                  shippingPhone: '0900000001'
                  shippingAddress: 12 Nguyễn Văn Cừ
                  paymentMethod: COD
      responses:
        '201':
          $ref: '#/components/responses/OrderCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [Order]
      operationId: listOrders
      summary: Liệt kê đơn theo quyền của người dùng hiện tại
      description: >-
        Chỉ CUSTOMER/EMPLOYEE; ADMIN trả 403 FORBIDDEN. CUSTOMER luôn chỉ thấy đơn
        của mình, mặc định mọi trạng thái. EMPLOYEE mặc định xem đơn của mọi khách
        ở PENDING/CONFIRMED/PROCESSING/SHIPPING; nếu truyền status thì lọc đúng
        trạng thái đó, kể cả COMPLETED/CANCELLED. orderType kết hợp với status
        bằng AND. Sắp xếp createdAt giảm dần, rồi id giảm dần. Không có kết quả
        hoặc page vượt số trang trả 200 với content rỗng; totalElements là số đơn
        khớp bộ lọc, không phải số dòng của trang hiện tại. page * size phải ≤ 2147483647;
        phân trang sai hoặc tên enum sai trả 400 VALIDATION_ERROR.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: orderType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OrderType'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            maximum: 2147483647
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          $ref: '#/components/responses/OrderPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderIdPath'
    get:
      tags: [Order]
      operationId: getOrder
      summary: Xem đơn hàng và snapshot món
      description: >-
        Chỉ CUSTOMER/EMPLOYEE. EMPLOYEE xem được mọi đơn, kể cả COMPLETED/CANCELLED,
        không bị giới hạn bởi queue mặc định của GET /api/orders. CUSTOMER xem
        đơn của mình; đơn tồn tại nhưng thuộc người khác trả 403 FORBIDDEN.
        ADMIN/sai role hoặc sub không parse được thành int64 > 0 cũng trả 403.
        Đơn không tồn tại trả 404 ORDER_NOT_FOUND; JWT thiếu/sai/hết hạn trả 401.
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Order]
      operationId: cancelOrder
      summary: CUSTOMER hủy đơn PENDING của mình
      description: >-
        Chỉ CUSTOMER. Đơn không tồn tại trả 404 ORDER_NOT_FOUND; đơn của người
        khác trả 403 FORBIDDEN. Chỉ PENDING được chuyển sang CANCELLED; các trạng
        thái khác, kể cả đã CANCELLED, trả 409 INVALID_ORDER_TRANSITION. Hoàn kho
        từng dòng (kể cả món INACTIVE), ghi cancelledAt/updatedAt trong cùng
        transaction; giữ bản ghi đơn và snapshot món. Trả 200 với đơn sau hủy.
        Phase 1 chưa chống hai yêu cầu hủy đồng thời hoàn kho hai lần.
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/orders/{orderId}/confirm:
    parameters:
      - $ref: '#/components/parameters/OrderIdPath'
    post:
      tags: [Order]
      operationId: confirmOrder
      summary: EMPLOYEE xác nhận đơn PENDING
      description: >-
        Chỉ EMPLOYEE; không cần body. Tương đương PUT status=CONFIRMED: chỉ PENDING
        được xác nhận; ghi confirmedBy bằng ID nhân viên từ JWT và confirmedAt,
        updatedAt. Đơn không tồn tại trả 404 ORDER_NOT_FOUND; mọi trạng thái khác,
        kể cả CONFIRMED, trả 409 INVALID_ORDER_TRANSITION.
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/orders/{orderId}/status:
    parameters:
      - $ref: '#/components/parameters/OrderIdPath'
    put:
      tags: [Order]
      operationId: updateOrderStatus
      summary: EMPLOYEE chuyển trạng thái hoặc hủy đơn
      description: |-
        Chỉ EMPLOYEE; áp dụng cho đơn của mọi khách. Các bước chuyển duy nhất:
        - PENDING → CONFIRMED hoặc CANCELLED.
        - CONFIRMED → PROCESSING hoặc CANCELLED.
        - PROCESSING → COMPLETED (DINE_IN), SHIPPING (DELIVERY), hoặc CANCELLED.
        - SHIPPING → COMPLETED; COMPLETED/CANCELLED không chuyển tiếp.

        status=PENDING luôn trả 400 VALIDATION_ERROR, trước khi tìm đơn.
        Bước chuyển khác không hợp lệ, kể cả gửi lại trạng thái hiện tại, trả
        409 INVALID_ORDER_TRANSITION; đơn không tồn tại trả 404 ORDER_NOT_FOUND.
        Chuyển CONFIRMED ghi confirmedBy/confirmedAt như route confirm; mọi lần
        chuyển cập nhật updatedAt, COMPLETED ghi completedAt, CANCELLED ghi
        cancelledAt và hoàn kho trong cùng transaction. Không hủy được SHIPPING.
        Phase 1 chưa chống hoàn kho hai lần khi hủy đồng thời.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderStatusRequest'
            example:
              status: PROCESSING
      responses:
        '200':
          $ref: '#/components/responses/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        JWT RS256 nhận từ POST /api/auth/token, gửi Authorization: Bearer <token>.
        Kiểm tra chữ ký, iss=sa-local-dev, aud chứa sa-mock-api, iat/exp và nbf
        (nếu có), sub không rỗng và role thuộc CUSTOMER/EMPLOYEE/ADMIN. Không có
        kế thừa role hoặc tra lại trạng thái tài khoản ở mỗi request. Cart/Order
        kiểm tra thêm sub là int64 > 0. JWT hết hạn hoặc sai trả 401 UNAUTHENTICATED.
  parameters:
    CategoryIdQuery:
      name: categoryId
      in: query
      required: false
      description: Không phải số nguyên trả 400; danh mục không tồn tại (kể cả ID ≤ 0) trả 404.
      schema:
        type: integer
        format: int64
    FoodIdPath:
      name: id
      in: path
      required: true
      description: Không phải số nguyên trả 400; món không tồn tại (kể cả ID ≤ 0) trả 404.
      schema:
        type: integer
        format: int64
    CartItemIdPath:
      name: cartItemId
      in: path
      required: true
      description: Không phải số nguyên trả 400; dòng giỏ không tồn tại (kể cả ID ≤ 0) trả 404.
      schema:
        type: integer
        format: int64
    OrderIdPath:
      name: orderId
      in: path
      required: true
      description: Không phải số nguyên trả 400; đơn không tồn tại (kể cả ID ≤ 0) trả 404.
      schema:
        type: integer
        format: int64
  requestBodies:
    FoodBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FoodRequest'
          example:
            categoryId: 1
            name: Phở bò
            description: Phở bò truyền thống
            price: 50000
            imageUrl: https://example.test/pho.jpg
            stockQuantity: 20
            status: ACTIVE
  responses:
    AccountCreated:
      description: Tạo CUSTOMER ở trạng thái ACTIVE.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Account'
    TokenIssued:
      description: Đăng nhập thành công.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TokenResponse'
    FoodList:
      description: Danh sách món ACTIVE; có thể rỗng.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Food'
    Food:
      description: Thông tin món ăn.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Food'
    Cart:
      description: Trạng thái đầy đủ của giỏ hàng sau thao tác.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Cart'
    OrderCreated:
      description: Đơn PENDING được tạo từ giỏ hàng.
      headers:
        Location:
          description: URI của đơn vừa tạo.
          schema:
            type: string
            example: /api/orders/1001
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Order'
    Order:
      description: Đơn hàng và snapshot món.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Order'
    OrderPage:
      description: Trang kết quả đơn hàng.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrderPage'
    BadRequest:
      description: JSON, path/query parameter hoặc dữ liệu nghiệp vụ không hợp lệ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Thiếu Bearer JWT, JWT không hợp lệ hoặc credentials sai.
      headers:
        WWW-Authenticate:
          description: Bearer challenge khi áp dụng.
          schema:
            type: string
            example: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Tài khoản không hoạt động, sai role hoặc không sở hữu tài nguyên.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: >-
        FOOD_NOT_FOUND, CATEGORY_NOT_FOUND, CART_ITEM_NOT_FOUND hoặc ORDER_NOT_FOUND
        tùy thao tác. Food GET coi INACTIVE là FOOD_NOT_FOUND; thêm giỏ/checkout
        coi INACTIVE là 409 FOOD_UNAVAILABLE. Dòng giỏ của khách khác trả
        CART_ITEM_NOT_FOUND; đơn của khách khác trả 403 FORBIDDEN.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: >-
        ACCOUNT_CONFLICT (đăng ký), FOOD_NAME_CONFLICT (tạo/sửa món),
        FOOD_UNAVAILABLE (thêm giỏ/checkout), INSUFFICIENT_STOCK (checkout),
        INVALID_ORDER_TRANSITION (xử lý đơn), CONFLICT (ràng buộc DB, gồm UNIQUE/FK/CHECK),
        CONCURRENT_UPDATE (deadlock/hết thời gian chờ khóa; transaction rollback,
        có thể gửi lại; server không tự retry).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UnsupportedMediaType:
      description: Request body không dùng application/json.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TooManyRequests:
      description: Vượt giới hạn đăng nhập theo email hoặc IP.
      headers:
        Retry-After:
          description: Số giây cần chờ trước khi thử lại.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InternalServerError:
      description: INTERNAL_ERROR — lỗi hệ thống không được xử lý cụ thể.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  headers:
    NoStore:
      description: Không cache response nhạy cảm.
      schema:
        type: string
        enum: [no-store]
  schemas:
    RegisterRequest:
      description: >-
        Chuỗi fullName/email/phone được trim bằng String.trim trước kiểm tra;
        fullName không blank, tối đa 150 Unicode code point; email sau trim tối đa
        254 code point, chuyển chữ thường rồi kiểm tra phần trước @ tối đa 64 đơn
        vị UTF-16 và mẫu [^@\s]+@[^@\s]+\.[^@\s]+. Phone sau trim
        khớp số nội địa 0 + 9 chữ số hoặc quốc tế + và 8–15 chữ số, chữ số đầu 1–9.
        Các giới hạn trên áp dụng cho giá trị sau chuẩn hóa, không phải chuỗi thô.
      type: object
      additionalProperties: false
      required: [fullName, email, phone, password, confirmPassword]
      properties:
        fullName:
          type: string
          minLength: 1
          description: Bắt buộc, không blank sau trim; tối đa 150 code point sau trim.
        email:
          type: string
          minLength: 5
          description: Bắt buộc; kiểm tra email và giới hạn độ dài sau trim như mô tả schema.
          example: customer@example.com
        phone:
          type: string
          pattern: '^[\x00-\x20]*(?:0[0-9]{9}|\+[1-9][0-9]{7,14})[\x00-\x20]*$'
          description: Bắt buộc; khoảng trắng/control ở hai đầu được trim trước kiểm tra.
          example: '0900000001'
        password:
          type: string
          format: password
          description: Giữ nguyên, không trim; tối đa 72 byte UTF-8 và 72 Unicode code point.
          writeOnly: true
          minLength: 8
          maxLength: 72
        confirmPassword:
          type: string
          format: password
          description: Giữ nguyên, không trim; tối đa 72 byte UTF-8 và 72 Unicode code point.
          writeOnly: true
          minLength: 8
          maxLength: 72
    LoginRequest:
      description: Email chuẩn hóa/kiểm tra như RegisterRequest; password không trim.
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          minLength: 5
          description: Sau trim tối đa 254 code point; chuyển chữ thường rồi kiểm tra mẫu email và phần trước @ tối đa 64 đơn vị UTF-16.
          example: customer@example.com
        password:
          type: string
          format: password
          description: Giữ nguyên, không trim; tối đa 72 byte UTF-8 và 72 Unicode code point.
          writeOnly: true
          minLength: 1
          maxLength: 72
    Account:
      type: object
      additionalProperties: false
      required: [id, fullName, email, phone, role, status]
      properties:
        id:
          type: string
        fullName:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
        phone:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/AccountStatus'
    TokenResponse:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          format: int64
          minimum: 1
          example: 5400
        user:
          $ref: '#/components/schemas/Account'
    Role:
      type: string
      enum: [CUSTOMER, EMPLOYEE, ADMIN]
    AccountStatus:
      type: string
      enum: [ACTIVE, INACTIVE, LOCKED]
    FoodRequest:
      description: >-
        Dùng cho cả POST và PUT; categoryId/name/price bắt buộc ở cả hai.
        name không blank và tối đa 150 đơn vị UTF-16 trước trim, lưu tên đã trim.
        Tên duy nhất toàn thực đơn theo collation MySQL utf8mb4_0900_as_ci
        (không phân biệt hoa thường, phân biệt dấu). description/imageUrl giữ nguyên,
        không trim; imageUrl chỉ kiểm tra độ dài, không kiểm tra định dạng URL.
      type: object
      required: [categoryId, name, price]
      properties:
        categoryId:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: string
          maxLength: 16000
          nullable: true
        price:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 9999999999999.99
          multipleOf: 0.01
          description: VND, lớn hơn 0; @Digits giới hạn 13 chữ số phần nguyên và 2 chữ số phần thập phân của BigDecimal đầu vào.
        imageUrl:
          type: string
          maxLength: 2048
          nullable: true
        stockQuantity:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          nullable: true
          description: Null hoặc bỏ qua thì tạo mặc định 0, cập nhật giữ nguyên.
        status:
          type: string
          enum: [ACTIVE, INACTIVE, null]
          nullable: true
          description: Null hoặc bỏ qua thì tạo mặc định ACTIVE, cập nhật giữ nguyên.
    Food:
      type: object
      required: [id, categoryId, name, price, stockQuantity, status]
      properties:
        id:
          type: integer
          format: int64
        categoryId:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: number
        imageUrl:
          type: string
          nullable: true
        stockQuantity:
          type: integer
        status:
          $ref: '#/components/schemas/FoodStatus'
    FoodStatus:
      type: string
      enum: [ACTIVE, INACTIVE]
    AddToCartRequest:
      type: object
      required: [foodId, quantity]
      properties:
        foodId:
          type: integer
          format: int64
          minimum: 1
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
    UpdateCartItemRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
    Cart:
      type: object
      required: [id, userId, items]
      properties:
        id:
          type: integer
          format: int64
          nullable: true
          description: Null khi khách chưa có giỏ (GET /api/cart trả giỏ rỗng).
        userId:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
    CartItem:
      type: object
      required: [id, food, quantity]
      properties:
        id:
          type: integer
          format: int64
        food:
          $ref: '#/components/schemas/Food'
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
    CreateOrderRequest:
      description: >-
        DINE_IN bắt buộc tableNumber không rỗng sau trim, chỉ CASH/BANK_TRANSFER;
        recipientName/shippingPhone/shippingAddress phải bỏ qua hoặc null (chuỗi
        rỗng cũng bị từ chối). DELIVERY bắt buộc cả ba trường giao hàng không rỗng
        sau trim, chỉ COD/BANK_TRANSFER; tableNumber phải bỏ qua hoặc null.
        Trường bắt buộc được trim trước lưu; note trim, blank thành null.
        Độ dài tối đa được kiểm tra trên chuỗi thô bằng @Size trước trim.
        shippingPhone chỉ kiểm tra không rỗng và độ dài, không áp dụng mẫu số điện
        thoại của Auth. Không nhận danh sách món/giá/userId từ client.
      type: object
      required: [orderType, paymentMethod]
      oneOf:
        - title: DINE_IN
          type: object
          required: [tableNumber]
          properties:
            orderType:
              type: string
              enum: [DINE_IN]
            paymentMethod:
              type: string
              enum: [CASH, BANK_TRANSFER]
            tableNumber:
              type: string
              minLength: 1
              pattern: '[^\x00-\x20]'
            recipientName:
              type: string
              nullable: true
              enum: [null]
            shippingPhone:
              type: string
              nullable: true
              enum: [null]
            shippingAddress:
              type: string
              nullable: true
              enum: [null]
        - title: DELIVERY
          type: object
          required: [recipientName, shippingPhone, shippingAddress]
          properties:
            orderType:
              type: string
              enum: [DELIVERY]
            paymentMethod:
              type: string
              enum: [COD, BANK_TRANSFER]
            tableNumber:
              type: string
              nullable: true
              enum: [null]
            recipientName:
              type: string
              minLength: 1
              pattern: '[^\x00-\x20]'
            shippingPhone:
              type: string
              minLength: 1
              pattern: '[^\x00-\x20]'
            shippingAddress:
              type: string
              minLength: 1
              pattern: '[^\x00-\x20]'
      properties:
        orderType:
          $ref: '#/components/schemas/OrderType'
        tableNumber:
          type: string
          maxLength: 20
          nullable: true
        recipientName:
          type: string
          maxLength: 150
          nullable: true
        shippingPhone:
          type: string
          maxLength: 20
          nullable: true
        shippingAddress:
          type: string
          maxLength: 500
          nullable: true
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        note:
          type: string
          maxLength: 500
          nullable: true
    UpdateOrderStatusRequest:
      description: >-
        status bắt buộc, không null; PENDING là giá trị enum có thể parse nhưng
        service luôn từ chối bằng 400 VALIDATION_ERROR. Xem operation updateOrderStatus
        để biết các bước chuyển; bước chuyển sai trả 409 INVALID_ORDER_TRANSITION.
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/OrderStatus'
    Order:
      description: >-
        foodName/unitPrice trong items là snapshot khi checkout, không đổi theo
        thực đơn hiện tại. totalAmount = tổng lineTotal, không cộng phí/thuế.
        Timestamp ở UTC, độ chính xác microsecond; các mốc chưa phát sinh là null.
        confirmedBy là ID nhân viên từ JWT đã xác nhận.
      type: object
      required:
        - id
        - userId
        - orderType
        - status
        - paymentMethod
        - createdAt
        - updatedAt
        - items
        - totalAmount
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        orderType:
          $ref: '#/components/schemas/OrderType'
        status:
          $ref: '#/components/schemas/OrderStatus'
        tableNumber:
          type: string
          nullable: true
        recipientName:
          type: string
          nullable: true
        shippingPhone:
          type: string
          nullable: true
        shippingAddress:
          type: string
          nullable: true
        paymentMethod:
