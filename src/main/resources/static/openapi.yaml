openapi: 3.0.3
info:
  title: ByteMe API
  version: 1.0.0
  description: >-
    Đặc tả thống nhất cho Auth, Food, Cart và Order. Nội dung phản ánh route,
    payload, phân quyền và HTTP status hiện có trong implementation.
servers:
  - url: /
    description: Cùng origin với Swagger UI
tags:
  - name: Auth
    description: Đăng ký và đăng nhập.
  - name: Food
    description: Đọc và quản lý thực đơn.
  - name: Cart
    description: Giỏ hàng của CUSTOMER hiện tại.
  - name: Order
    description: Tạo, đọc và chuyển trạng thái đơn hàng.
paths:
  /api/auth/register:
    post:
      tags: [Auth]
      operationId: registerCustomer
      summary: Đăng ký tài khoản CUSTOMER
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              fullName: Nguyễn Văn An
              email: customer@example.com
              phone: '0900000001'
              password: DemoOnly123!
              confirmPassword: DemoOnly123!
      responses:
        '201':
          $ref: '#/components/responses/AccountCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/auth/token:
    post:
      tags: [Auth]
      operationId: issueAccessToken
      summary: Đăng nhập và cấp Bearer JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: customer@example.com
              password: DemoOnly123!
      responses:
        '200':
          $ref: '#/components/responses/TokenIssued'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/foods:
    get:
      tags: [Food]
      operationId: listActiveFoods
      summary: Xem danh sách món đang bán
      security: []
      parameters:
        - $ref: '#/components/parameters/CategoryIdQuery'
      responses:
        '200':
          $ref: '#/components/responses/FoodList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Food]
      operationId: createFood
      summary: Thêm món ăn
      description: Chỉ ADMIN.
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/FoodBody'
      responses:
        '201':
          $ref: '#/components/responses/Food'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/foods/search:
    get:
      tags: [Food]
      operationId: searchActiveFoods
      summary: Tìm món đang bán theo từ khóa
      security: []
      parameters:
        - name: q
          in: query
          required: true
          description: Từ khóa sau khi trim phải có từ 1 đến 100 ký tự.
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - $ref: '#/components/parameters/CategoryIdQuery'
      responses:
        '200':
          $ref: '#/components/responses/FoodList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/foods/{id}:
    parameters:
      - $ref: '#/components/parameters/FoodIdPath'
    get:
      tags: [Food]
      operationId: getActiveFood
      summary: Xem chi tiết món đang bán
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Food'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Food]
      operationId: updateFood
      summary: Cập nhật món ăn
      description: Chỉ ADMIN.
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/FoodBody'
      responses:
        '200':
          $ref: '#/components/responses/Food'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Food]
      operationId: deactivateFood
      summary: Ngừng bán món ăn
      description: >-
        Soft delete bằng trạng thái INACTIVE. Chỉ ADMIN.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Món đã chuyển sang INACTIVE; response không có body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/cart:
    get:
      tags: [Cart]
      operationId: getCurrentCart
      summary: Xem giỏ hàng hiện tại
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Cart'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/cart/items:
    post:
      tags: [Cart]
      operationId: addCartItem
      summary: Thêm món vào giỏ
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddToCartRequest'
            example:
              foodId: 1
              quantity: 2
      responses:
        '200':
          $ref: '#/components/responses/Cart'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/cart/items/{cartItemId}:
    parameters:
      - $ref: '#/components/parameters/CartItemIdPath'
    put:
      tags: [Cart]
      operationId: updateCartItem
      summary: Đặt lại số lượng của một dòng giỏ hàng
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCartItemRequest'
            example:
              quantity: 3
      responses:
        '200':
          $ref: '#/components/responses/Cart'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Cart]
      operationId: removeCartItem
      summary: Xóa một dòng khỏi giỏ hàng
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Cart'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/orders:
    post:
      tags: [Order]
      operationId: createOrder
      summary: Tạo đơn từ giỏ hàng hiện tại
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            examples:
              dineIn:
                value:
                  orderType: DINE_IN
                  tableNumber: B05
                  paymentMethod: CASH
                  note: Ít cay
              delivery:
                value:
                  orderType: DELIVERY
                  recipientName: Nguyễn Văn An
                  shippingPhone: '0900000001'
                  shippingAddress: 12 Nguyễn Văn Cừ
                  paymentMethod: COD
      responses:
        '201':
          $ref: '#/components/responses/OrderCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [Order]
      operationId: listOrders
      summary: Liệt kê đơn theo quyền của người dùng hiện tại
      description: CUSTOMER chỉ thấy đơn của mình; EMPLOYEE thấy các đơn cần xử lý.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: orderType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OrderType'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          $ref: '#/components/responses/OrderPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderIdPath'
    get:
      tags: [Order]
      operationId: getOrder
      summary: Xem đơn hàng và snapshot món
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Order]
      operationId: cancelOrder
      summary: CUSTOMER hủy đơn PENDING của mình
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/orders/{orderId}/confirm:
    parameters:
      - $ref: '#/components/parameters/OrderIdPath'
    post:
      tags: [Order]
      operationId: confirmOrder
      summary: EMPLOYEE xác nhận đơn PENDING
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/orders/{orderId}/status:
    parameters:
      - $ref: '#/components/parameters/OrderIdPath'
    put:
      tags: [Order]
      operationId: updateOrderStatus
      summary: EMPLOYEE chuyển trạng thái hoặc hủy đơn
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderStatusRequest'
            example:
              status: PROCESSING
      responses:
        '200':
          $ref: '#/components/responses/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT nhận từ POST /api/auth/token.
  parameters:
    CategoryIdQuery:
      name: categoryId
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 1
    FoodIdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    CartItemIdPath:
      name: cartItemId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    OrderIdPath:
      name: orderId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  requestBodies:
    FoodBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FoodRequest'
          example:
            categoryId: 1
            name: Phở bò
            description: Phở bò truyền thống
            price: 50000
            imageUrl: https://example.test/pho.jpg
            stockQuantity: 20
            status: ACTIVE
  responses:
    AccountCreated:
      description: Tạo CUSTOMER ở trạng thái ACTIVE.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Account'
    TokenIssued:
      description: Đăng nhập thành công.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TokenResponse'
    FoodList:
      description: Danh sách món ACTIVE; có thể rỗng.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Food'
    Food:
      description: Thông tin món ăn.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Food'
    Cart:
      description: Trạng thái đầy đủ của giỏ hàng sau thao tác.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Cart'
    OrderCreated:
      description: Đơn PENDING được tạo từ giỏ hàng.
      headers:
        Location:
          description: URI của đơn vừa tạo.
          schema:
            type: string
            example: /api/orders/1001
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Order'
    Order:
      description: Đơn hàng và snapshot món.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Order'
    OrderPage:
      description: Trang kết quả đơn hàng.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrderPage'
    BadRequest:
      description: JSON, path/query parameter hoặc dữ liệu nghiệp vụ không hợp lệ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Thiếu Bearer JWT, JWT không hợp lệ hoặc credentials sai.
      headers:
        WWW-Authenticate:
          description: Bearer challenge khi áp dụng.
          schema:
            type: string
            example: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Tài khoản không hoạt động, sai role hoặc không sở hữu tài nguyên.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Không tìm thấy cart, item, food, category hoặc order tương ứng.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Trùng dữ liệu, món ngừng bán, thiếu tồn kho hoặc chuyển trạng thái không hợp lệ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UnsupportedMediaType:
      description: Request body không dùng application/json.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TooManyRequests:
      description: Vượt giới hạn đăng nhập theo email hoặc IP.
      headers:
        Retry-After:
          description: Số giây cần chờ trước khi thử lại.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InternalServerError:
      description: Lỗi hệ thống không được xử lý cụ thể.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  headers:
    NoStore:
      description: Không cache response nhạy cảm.
      schema:
        type: string
        enum: [no-store]
  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [fullName, email, phone, password, confirmPassword]
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 150
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
        phone:
          type: string
          maxLength: 20
          pattern: '^(?:0[0-9]{9}|\+[1-9][0-9]{7,14})$'
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          maxLength: 72
        confirmPassword:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          maxLength: 72
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 72
    Account:
      type: object
      additionalProperties: false
      required: [id, fullName, email, phone, role, status]
      properties:
        id:
          type: string
        fullName:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
        phone:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/AccountStatus'
    TokenResponse:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          format: int64
          minimum: 1
          example: 5400
        user:
          $ref: '#/components/schemas/Account'
    Role:
      type: string
      enum: [CUSTOMER, EMPLOYEE, ADMIN]
    AccountStatus:
      type: string
      enum: [ACTIVE, INACTIVE, LOCKED]
    FoodRequest:
      type: object
      required: [categoryId, name, price]
      properties:
        categoryId:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true
        price:
          type: number
          minimum: 1
        imageUrl:
          type: string
          nullable: true
        stockQuantity:
          type: integer
          minimum: 0
          default: 0
        status:
          $ref: '#/components/schemas/FoodStatus'
    Food:
      type: object
      required: [id, categoryId, name, price, stockQuantity, status]
      properties:
        id:
          type: integer
          format: int64
        categoryId:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: number
        imageUrl:
          type: string
          nullable: true
        stockQuantity:
          type: integer
        status:
          $ref: '#/components/schemas/FoodStatus'
    FoodStatus:
      type: string
      enum: [ACTIVE, INACTIVE]
    AddToCartRequest:
      type: object
      required: [foodId, quantity]
      properties:
        foodId:
          type: integer
          format: int64
          minimum: 1
        quantity:
          type: integer
          minimum: 1
    UpdateCartItemRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 1
    Cart:
      type: object
      required: [id, userId, items]
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
    CartItem:
      type: object
      required: [id, food, quantity]
      properties:
        id:
